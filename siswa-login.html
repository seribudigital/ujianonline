<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartExam-Online | Login Siswa</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Supabase JS Library CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="login-wrapper">

    <div class="login-card card">
      <div class="login-header">
        <div class="login-logo">
          <i data-lucide="graduation-cap" style="width: 32px; height: 32px;"></i>
        </div>
        <h2>SmartExam-Online</h2>
        <p style="color: var(--text-muted); font-size: 0.875rem;">Platform Ujian Mandiri Siswa</p>
      </div>

      <!-- Live status of active session -->
      <div id="session-status-banner" style="margin-bottom: 1.5rem;"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="nisn" class="form-label">NISN (Nomor Induk Siswa Nasional)</label>
          <input type="text" id="nisn" class="form-control" placeholder="Contoh: 0012345678" required autocomplete="off" inputmode="numeric" pattern="[0-9]*">
          <small id="nisn-hint" style="color: var(--text-muted); font-size: 0.75rem; display: block; margin-top: 4px;">
            Masukkan 10 digit NISN Anda
          </small>
        </div>

        <div class="form-group" style="margin-bottom: 1.5rem;">
          <label for="nama" class="form-label">Nama Lengkap Siswa</label>
          <input type="text" id="nama" class="form-control" placeholder="Nama sesuai daftar hadir" required autocomplete="off">
        </div>

        <button type="submit" class="btn btn-primary" id="btn-submit" style="width: 100%;">
          <i data-lucide="log-in"></i> Masuk Ruang Ujian
        </button>
      </form>
    </div>

    <!-- Mini Footer -->
    <div style="margin-top: 2rem; text-align: center; font-size: 0.75rem; color: var(--text-muted);">
      <p>Koneksi: Cloud Database (Supabase Active)</p>
    </div>
  </div>

  <script>
    // Supabase Configuration
    const SUPABASE_URL = "https://cuqskujuehhgndnazydq.supabase.co/rest/v1/";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN1cXNrdWp1ZWhoZ25kbmF6eWRxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyMjk0MDQsImV4cCI6MjA5NTgwNTQwNH0.Uacs4kd4qPtO3ig1P_cKM0Rkv0UVsScoGuvx_AxKoPY";
    const supabase = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

    // Initialize Lucide icons
    lucide.createIcons();

    const form = document.getElementById('login-form');
    const nisnInput = document.getElementById('nisn');
    const namaInput = document.getElementById('nama');
    const btnSubmit = document.getElementById('btn-submit');
    const sessionStatusBanner = document.getElementById('session-status-banner');

    let activeSession = null;

    // Check if exam session and student session already active
    async function checkSessions() {
      // Show loading status
      sessionStatusBanner.innerHTML = `
        <div class="alert alert-info" style="margin-bottom: 0;">
          <i data-lucide="refresh-cw" class="lucide-icon" style="width: 18px; height: 18px; flex-shrink: 0; animation: spin 1.5s linear infinite;"></i>
          <div>
            <strong>Menghubungkan ke Cloud...</strong>
          </div>
        </div>
      `;
      lucide.createIcons();

      if (!supabase) {
        showNoSessionBanner("Supabase client belum diinisialisasi.");
        return;
      }

      try {
        // Fetch the latest active exam session from Supabase
        const { data, error } = await supabase
          .from('ujian_aktif')
          .select('*')
          .order('created_at', { ascending: false })
          .limit(1)
          .maybeSingle();

        if (error) throw error;

        if (data) {
          activeSession = data;
          const meta = data;
          
          // Display exam details
          sessionStatusBanner.innerHTML = `
            <div class="alert alert-info" style="margin-bottom: 0;">
              <i data-lucide="book-open" style="width: 18px; height: 18px; flex-shrink: 0; color: var(--secondary);"></i>
              <div>
                <strong style="color: var(--text-dark);">${meta.mapel_nama}</strong>
                <p style="font-size: 0.75rem; margin-top: 2px;">
                  Madrasah: ${meta.madrasah}<br>
                  Kelas: ${meta.kelas} | Paket: ${meta.paket}
                </p>
              </div>
            </div>
          `;

          // Save active session locally
          localStorage.setItem('smartexam_active_session', JSON.stringify(activeSession));

          // Auto-redirect if student session already present
          const studentSessionRaw = localStorage.getItem('smartexam_student_session');
          if (studentSessionRaw) {
            window.location.href = 'siswa-ujian.html';
          }
        } else {
          showNoSessionBanner("Silakan hubungi proktor/pengawas ruang untuk mengunggah soal ujian terlebih dahulu.");
        }
      } catch (e) {
        console.error("Gagal membaca active session dari Supabase", e);
        showNoSessionBanner("Gagal terhubung ke database. " + e.message);
      }
      lucide.createIcons();
    }

    function showNoSessionBanner(message) {
      sessionStatusBanner.innerHTML = `
        <div class="alert alert-danger" style="margin-bottom: 0;">
          <i data-lucide="alert-octagon" style="width: 18px; height: 18px; flex-shrink: 0;"></i>
          <div>
            <strong>Sesi Ujian Belum Aktif</strong>
            <p style="font-size: 0.75rem; margin-top: 2px;">
              ${message}
            </p>
          </div>
        </div>
      `;
      // Disable login button
      btnSubmit.disabled = true;
      btnSubmit.style.opacity = '0.5';
      btnSubmit.style.cursor = 'not-allowed';
    }

    // Input validations for NISN (numeric and ideally 10 digits)
    nisnInput.addEventListener('input', (e) => {
      // Clean non-digits
      const cleanValue = e.target.value.replace(/\D/g, '');
      e.target.value = cleanValue;

      const hint = document.getElementById('nisn-hint');
      if (cleanValue.length > 0 && cleanValue.length !== 10) {
        hint.style.color = 'var(--danger)';
        hint.textContent = `NISN harus 10 digit (saat ini: ${cleanValue.length} digit)`;
      } else if (cleanValue.length === 10) {
        hint.style.color = 'var(--success)';
        hint.textContent = 'NISN valid (10 digit)';
      } else {
        hint.style.color = 'var(--text-muted)';
        hint.textContent = 'Masukkan 10 digit NISN Anda';
      }
    });

    // Form submit handler
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      if (!activeSession) {
        alert('Sesi ujian belum siap. Silakan hubungi proktor.');
        return;
      }

      const nisnVal = nisnInput.value.trim();
      const namaVal = namaInput.value.trim();

      if (nisnVal.length !== 10) {
        alert('NISN harus tepat 10 digit angka!');
        return;
      }

      if (namaVal.length < 2) {
        alert('Silakan masukkan nama lengkap Anda dengan benar!');
        return;
      }

      btnSubmit.disabled = true;
      btnSubmit.innerHTML = `<i data-lucide="loader" class="lucide-icon" style="animation: spin 1s linear infinite;"></i> Menghubungkan...`;
      lucide.createIcons();

      try {
        // Fetch or create student row in Supabase
        let { data: studentData, error: selectError } = await supabase
          .from('jawaban_siswa')
          .select('*')
          .eq('mapel_id', activeSession.id)
          .eq('nisn', nisnVal)
          .maybeSingle();

        if (selectError) throw selectError;

        if (!studentData) {
          // New login, create a record
          const { data: newRow, error: insertError } = await supabase
            .from('jawaban_siswa')
            .insert({
              mapel_id: activeSession.id,
              nisn: nisnVal,
              nama_siswa: namaVal,
              status_pengumpulan: 'normal',
              jawaban_pg: {},
              jawaban_uraian: {},
              violation_count: 0
            })
            .select()
            .single();

          if (insertError) throw insertError;
          studentData = newRow;
        }

        // Save Student info to localStorage (including state from database)
        const studentSession = {
          nisn: nisnVal,
          nama: namaVal,
          waktu_login: studentData.waktu_mulai
        };

        localStorage.setItem('smartexam_student_session', JSON.stringify(studentSession));
        localStorage.setItem('smartexam_jawaban_siswa', JSON.stringify({
          pg: studentData.jawaban_pg || {},
          uraian: studentData.jawaban_uraian || {}
        }));
        localStorage.setItem('smartexam_violation_count', studentData.violation_count || 0);

        // Redirect to exam screen
        window.location.href = 'siswa-ujian.html';
      } catch (err) {
        alert("Gagal masuk ruang ujian: " + err.message);
        console.error(err);
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = `<i data-lucide="log-in"></i> Masuk Ruang Ujian`;
        lucide.createIcons();
      }
    });

    // Run session checks
    checkSessions();
  </script>
</body>
</html>
