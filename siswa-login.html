<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AmanaExam | Login Siswa</title>
  <meta name="description" content="AmanaExam - Platform Modern Computer Assisted Test (CAT) Berbasis Integritas dan Kejujuran untuk Madrasah.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 6 C75 6 88 16 88 44 C88 71 50 92 50 92 C50 92 12 71 12 44 C12 16 25 6 50 6 Z' fill='%23059669'/%3E%3Cpath d='M50 12 C70 12 82 20 82 44 C82 67 50 85 50 85 C50 85 18 67 18 44 C18 20 30 12 50 12 Z' fill='none' stroke='%23F59E0B' stroke-width='2.5' opacity='0.8'/%3E%3Cpath d='M50 22 L74 31 L50 40 L26 31 Z' fill='%23F59E0B'/%3E%3Cpath d='M36 34.5 V42 C36 46 64 46 64 42 V34.5' fill='%23F59E0B'/%3E%3Cpath d='M50 31 L68 33.5 V43' fill='none' stroke='%23FFFFFF' stroke-width='1.5' stroke-linecap='round'/%3E%3Ccircle cx='68' cy='44.5' r='1.5' fill='%23FFFFFF'/%3E%3Cpath d='M32 54 C41 49.5 48 51.5 50 53.5 C52 51.5 59 49.5 68 54 L68 68 C59 63.5 52 65.5 50 67.5 C48 65.5 41 63.5 32 68 Z' fill='%23FFFFFF'/%3E%3Cline x1='50' y1='53.5' x2='50' y2='67.5' stroke='%23F59E0B' stroke-width='1.5'/%3E%3Cpath d='M42.5 59 L47.5 64 L57.5 53.5' fill='none' stroke='%23059669' stroke-width='4.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Supabase JS Library CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="login-wrapper">

    <div class="login-card card">
      <div class="login-header">
        <div class="login-logo" id="login-logo-container" style="width: 80px; height: 80px; background: transparent; box-shadow: none;">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" class="amana-logo" style="width: 100%; height: 100%;">
            <defs>
              <linearGradient id="amanaShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#059669" />
                <stop offset="100%" stop-color="#047857" />
              </linearGradient>
              <linearGradient id="amanaGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#F59E0B" />
                <stop offset="100%" stop-color="#D97706" />
              </linearGradient>
            </defs>
            <path d="M50 6 C75 6 88 16 88 44 C88 71 50 92 50 92 C50 92 12 71 12 44 C12 16 25 6 50 6 Z" fill="url(#amanaShieldGrad)" />
            <path d="M50 12 C70 12 82 20 82 44 C82 67 50 85 50 85 C50 85 18 67 18 44 C18 20 30 12 50 12 Z" fill="none" stroke="url(#amanaGoldGrad)" stroke-width="2.5" opacity="0.8" />
            <path d="M50 22 L74 31 L50 40 L26 31 Z" fill="url(#amanaGoldGrad)" />
            <path d="M36 34.5 V42 C36 46 64 46 64 42 V34.5" fill="url(#amanaGoldGrad)" />
            <path d="M50 31 L68 33.5 V43" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />
            <circle cx="68" cy="44.5" r="1.5" fill="#FFFFFF" />
            <path d="M32 54 C41 49.5 48 51.5 50 53.5 C52 51.5 59 49.5 68 54 L68 68 C59 63.5 52 65.5 50 67.5 C48 65.5 41 63.5 32 68 Z" fill="#FFFFFF" />
            <line x1="50" y1="53.5" x2="50" y2="67.5" stroke="url(#amanaGoldGrad)" stroke-width="1.5" />
            <path d="M42.5 59 L47.5 64 L57.5 53.5" fill="none" stroke="#059669" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </div>
        <h2>AmanaExam</h2>
        <p style="color: var(--text-muted); font-size: 0.875rem;">Platform Ujian Mandiri Siswa</p>
      </div>

      <!-- Live status of active session -->
      <div id="session-status-banner" style="margin-bottom: 1.5rem;"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="nisn" class="form-label">NISN (Nomor Induk Siswa Nasional)</label>
          <input type="text" id="nisn" class="form-control" placeholder="Contoh: 0012345678" required autocomplete="off" inputmode="numeric" pattern="[0-9]*">
          <small id="nisn-hint" style="color: var(--text-muted); font-size: 0.75rem; display: block; margin-top: 4px;">
            Masukkan 10 digit NISN Anda
          </small>
        </div>

        <div class="form-group" style="margin-bottom: 1.5rem;">
          <label for="nama" class="form-label">Nama Lengkap Siswa</label>
          <input type="text" id="nama" class="form-control" placeholder="Nama sesuai daftar hadir" required autocomplete="off">
        </div>

        <button type="submit" class="btn btn-primary" id="btn-submit" style="width: 100%;">
          <i data-lucide="log-in"></i> Masuk Ruang Ujian
        </button>
      </form>
    </div>

    <!-- Mini Footer -->
    <div style="margin-top: 2rem; text-align: center; font-size: 0.75rem; color: var(--text-muted);">
      <p>Koneksi: Cloud Database (Supabase Active)</p>
    </div>
  </div>

  <script>
    // Supabase Configuration
    const SUPABASE_URL = "https://cuqskujuehhgndnazydq.supabase.co/rest/v1/";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN1cXNrdWp1ZWhoZ25kbmF6eWRxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyMjk0MDQsImV4cCI6MjA5NTgwNTQwNH0.Uacs4kd4qPtO3ig1P_cKM0Rkv0UVsScoGuvx_AxKoPY";

    // Clean URL to handle rest/v1 suffixes automatically
    let cleanUrl = SUPABASE_URL.trim();
    if (cleanUrl.endsWith('/rest/v1/')) {
      cleanUrl = cleanUrl.slice(0, -9);
    } else if (cleanUrl.endsWith('/rest/v1')) {
      cleanUrl = cleanUrl.slice(0, -8);
    }
    if (cleanUrl.endsWith('/')) {
      cleanUrl = cleanUrl.slice(0, -1);
    }

    const supabaseClient = window.supabase ? window.supabase.createClient(cleanUrl, SUPABASE_KEY) : null;

    // Initialize Lucide icons
    lucide.createIcons();

    const form = document.getElementById('login-form');
    const nisnInput = document.getElementById('nisn');
    const namaInput = document.getElementById('nama');
    const btnSubmit = document.getElementById('btn-submit');
    const sessionStatusBanner = document.getElementById('session-status-banner');

    let activeSession = null;

    // Check if exam session and student session already active
    async function checkSessions() {
      // Show loading status
      sessionStatusBanner.innerHTML = `
        <div class="alert alert-info" style="margin-bottom: 0;">
          <i data-lucide="refresh-cw" class="lucide-icon" style="width: 18px; height: 18px; flex-shrink: 0; animation: spin 1.5s linear infinite;"></i>
          <div>
            <strong>Menghubungkan ke Cloud...</strong>
          </div>
        </div>
      `;
      lucide.createIcons();

      if (!supabaseClient) {
        showNoSessionBanner("Supabase client belum diinisialisasi.");
        return;
      }

      try {
        // Fetch the latest active exam session from Supabase
        const { data, error } = await supabaseClient
          .from('ujian_aktif')
          .select('*')
          .order('created_at', { ascending: false })
          .limit(1)
          .maybeSingle();

        if (error) throw error;

        if (data) {
          activeSession = data;
          
          // Deserialize year, semester, and guru from the tahun column
          if (activeSession.tahun && typeof activeSession.tahun === 'string' && activeSession.tahun.includes('|')) {
            const parts = activeSession.tahun.split('|');
            activeSession.tahun = parts[0] || '';
            activeSession.semester = parts[1] || '-';
            activeSession.guru = parts[2] || '-';
          }

          const meta = data;
          
          // Display exam details
          sessionStatusBanner.innerHTML = `
            <div class="alert alert-info" style="margin-bottom: 0;">
              <i data-lucide="book-open" style="width: 18px; height: 18px; flex-shrink: 0; color: var(--secondary);"></i>
              <div>
                <strong style="color: var(--text-dark);">${meta.mapel_nama}</strong>
                <p style="font-size: 0.75rem; margin-top: 2px;">
                  Madrasah: ${meta.madrasah}<br>
                  Kelas: ${meta.kelas} | Paket: ${meta.paket}
                </p>
              </div>
            </div>
          `;

          // Save active session locally
          localStorage.setItem('smartexam_active_session', JSON.stringify(activeSession));
          displayLogo();

          // Auto-redirect if student session already present
          const studentSessionRaw = localStorage.getItem('smartexam_student_session');
          if (studentSessionRaw) {
            window.location.href = 'siswa-ujian.html';
          }
        } else {
          showNoSessionBanner("Silakan hubungi proktor/pengawas ruang untuk mengunggah soal ujian terlebih dahulu.");
        }
      } catch (e) {
        console.error("Gagal membaca active session dari Supabase", e);
        showNoSessionBanner("Gagal terhubung ke database. " + e.message);
      }
      lucide.createIcons();
    }

    function showNoSessionBanner(message) {
      sessionStatusBanner.innerHTML = `
        <div class="alert alert-danger" style="margin-bottom: 0;">
          <i data-lucide="alert-octagon" style="width: 18px; height: 18px; flex-shrink: 0;"></i>
          <div>
            <strong>Sesi Ujian Belum Aktif</strong>
            <p style="font-size: 0.75rem; margin-top: 2px;">
              ${message}
            </p>
          </div>
        </div>
      `;
      // Disable login button
      btnSubmit.disabled = true;
      btnSubmit.style.opacity = '0.5';
      btnSubmit.style.cursor = 'not-allowed';
    }

    // Input validations for NISN (numeric and ideally 10 digits)
    nisnInput.addEventListener('input', (e) => {
      // Clean non-digits
      const cleanValue = e.target.value.replace(/\D/g, '');
      e.target.value = cleanValue;

      const hint = document.getElementById('nisn-hint');
      if (cleanValue.length > 0 && cleanValue.length !== 10) {
        hint.style.color = 'var(--danger)';
        hint.textContent = `NISN harus 10 digit (saat ini: ${cleanValue.length} digit)`;
      } else if (cleanValue.length === 10) {
        hint.style.color = 'var(--success)';
        hint.textContent = 'NISN valid (10 digit)';
      } else {
        hint.style.color = 'var(--text-muted)';
        hint.textContent = 'Masukkan 10 digit NISN Anda';
      }
    });

    // Form submit handler
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      if (!activeSession) {
        alert('Sesi ujian belum siap. Silakan hubungi proktor.');
        return;
      }

      const nisnVal = nisnInput.value.trim();
      const namaVal = namaInput.value.trim();

      if (nisnVal.length !== 10) {
        alert('NISN harus tepat 10 digit angka!');
        return;
      }

      if (namaVal.length < 2) {
        alert('Silakan masukkan nama lengkap Anda dengan benar!');
        return;
      }

      btnSubmit.disabled = true;
      btnSubmit.innerHTML = `<i data-lucide="loader" class="lucide-icon" style="animation: spin 1s linear infinite;"></i> Menghubungkan...`;
      lucide.createIcons();

      try {
        // Fetch or create student row in Supabase
        let { data: studentData, error: selectError } = await supabaseClient
          .from('jawaban_siswa')
          .select('*')
          .eq('mapel_id', activeSession.id)
          .eq('nisn', nisnVal)
          .maybeSingle();

        if (selectError) throw selectError;

        if (!studentData) {
          // Check if session is active
          if (activeSession && activeSession.is_active === false) {
            alert("Maaf, sesi ujian untuk mata pelajaran ini sedang ditutup oleh Proktor.");
            btnSubmit.disabled = false;
            btnSubmit.innerHTML = `<i data-lucide="log-in"></i> Masuk Ruang Ujian`;
            lucide.createIcons();
            return;
          }

          // New login, create a record
          const { data: newRow, error: insertError } = await supabaseClient
            .from('jawaban_siswa')
            .insert({
              mapel_id: activeSession.id,
              nisn: nisnVal,
              nama_siswa: namaVal,
              status_pengumpulan: 'normal',
              jawaban_pg: {},
              jawaban_uraian: {},
              violation_count: 0
            })
            .select()
            .single();

          if (insertError) throw insertError;
          studentData = newRow;
        }

        // Save Student info to localStorage (including state from database)
        const studentSession = {
          nisn: nisnVal,
          nama: namaVal,
          waktu_login: studentData.waktu_mulai
        };

        localStorage.setItem('smartexam_student_session', JSON.stringify(studentSession));
        localStorage.setItem('smartexam_jawaban_siswa', JSON.stringify({
          pg: studentData.jawaban_pg || {},
          uraian: studentData.jawaban_uraian || {}
        }));
        localStorage.setItem('smartexam_violation_count', studentData.violation_count || 0);

        // Redirect to exam screen
        window.location.href = 'siswa-ujian.html';
      } catch (err) {
        alert("Gagal masuk ruang ujian: " + err.message);
        console.error(err);
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = `<i data-lucide="log-in"></i> Masuk Ruang Ujian`;
        lucide.createIcons();
      }
    });

    // Display dynamic school logo with fallbacks
    function displayLogo() {
      const activeSessionRaw = localStorage.getItem('smartexam_active_session');
      let logoType = 'ma'; // default
      if (activeSessionRaw) {
        try {
          const session = JSON.parse(activeSessionRaw);
          const meta = session.metadata ? session.metadata : session;
          
          const mapelLower = (meta.mapel_nama || '').toLowerCase();
          const kelasLower = (meta.kelas || '').toLowerCase();
          const madrasahLower = (meta.madrasah || '').toLowerCase();
          
          const isMts = mapelLower.includes('mts') || 
                        /\b(7|8|9|vii|viii|ix)\b/.test(kelasLower) || 
                        madrasahLower.includes('mts') || 
                        madrasahLower.includes('tsanawiyah');
                        
          const isMa = mapelLower.includes('ma') || 
                       mapelLower.includes('aliyah') || 
                       /\b(10|11|12|x|xi|xii)\b/.test(kelasLower) || 
                       madrasahLower.includes('ma') || 
                       madrasahLower.includes('aliyah');

          if (isMts && !isMa) {
            logoType = 'mts';
          }
        } catch (e) {
          console.error("Gagal membaca active session untuk logo", e);
        }
      }
      
      const savedLogo = localStorage.getItem(`smartexam_logo_${logoType}`);
      
      // Keep MTs and MA Alkhoir as defaults if the school name contains Alkhoir
      const activeSessionRaw2 = localStorage.getItem('smartexam_active_session');
      let isAlkhoir = true; // Default to true if session metadata is not yet parsed
      if (activeSessionRaw2) {
        try {
          const session = JSON.parse(activeSessionRaw2);
          const meta = session.metadata ? session.metadata : session;
          const madrasahLower = (meta.madrasah || '').toLowerCase();
          isAlkhoir = madrasahLower.includes('alkhoir') || madrasahLower.includes('al-khoir') || madrasahLower.includes('al khoir');
        } catch (e) {}
      }

      const defaultLogo = isAlkhoir ? (logoType === 'mts' ? 'logo mts Alkhoir.png' : 'logo MA Alkhoir.jpg') : null;
      const logoUrl = savedLogo || defaultLogo;
      
      const logoContainer = document.getElementById('login-logo-container');
      if (logoContainer) {
        if (logoUrl) {
          logoContainer.innerHTML = `<img src="${logoUrl}" style="width: 100%; height: 100%; object-fit: contain; border-radius: inherit;" alt="Logo Madrasah">`;
          logoContainer.style.backgroundColor = 'transparent';
        } else {
          // Fallback to AmanaExam SVG Logo
          logoContainer.innerHTML = `
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" class="amana-logo" style="width: 100%; height: 100%;">
              <defs>
                <linearGradient id="amanaShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#059669" />
                  <stop offset="100%" stop-color="#047857" />
                </linearGradient>
                <linearGradient id="amanaGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#F59E0B" />
                  <stop offset="100%" stop-color="#D97706" />
                </linearGradient>
              </defs>
              <path d="M50 6 C75 6 88 16 88 44 C88 71 50 92 50 92 C50 92 12 71 12 44 C12 16 25 6 50 6 Z" fill="url(#amanaShieldGrad)" />
              <path d="M50 12 C70 12 82 20 82 44 C82 67 50 85 50 85 C50 85 18 67 18 44 C18 20 30 12 50 12 Z" fill="none" stroke="url(#amanaGoldGrad)" stroke-width="2.5" opacity="0.8" />
              <path d="M50 22 L74 31 L50 40 L26 31 Z" fill="url(#amanaGoldGrad)" />
              <path d="M36 34.5 V42 C36 46 64 46 64 42 V34.5" fill="url(#amanaGoldGrad)" />
              <path d="M50 31 L68 33.5 V43" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />
              <circle cx="68" cy="44.5" r="1.5" fill="#FFFFFF" />
              <path d="M32 54 C41 49.5 48 51.5 50 53.5 C52 51.5 59 49.5 68 54 L68 68 C59 63.5 52 65.5 50 67.5 C48 65.5 41 63.5 32 68 Z" fill="#FFFFFF" />
              <line x1="50" y1="53.5" x2="50" y2="67.5" stroke="url(#amanaGoldGrad)" stroke-width="1.5" />
              <path d="M42.5 59 L47.5 64 L57.5 53.5" fill="none" stroke="#059669" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          `;
          logoContainer.style.backgroundColor = 'transparent';
        }
      }
    }

    // Run session checks
    displayLogo();
    checkSessions();
  </script>
</body>
</html>
