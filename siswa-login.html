<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>AmanaExam | Login Siswa</title>
  <meta name="description" content="AmanaExam - Platform Modern Computer Assisted Test (CAT) Berbasis Integritas dan Kejujuran untuk Madrasah.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 6 C75 6 88 16 88 44 C88 71 50 92 50 92 C50 92 12 71 12 44 C12 16 25 6 50 6 Z' fill='%23059669'/%3E%3Cpath d='M50 12 C70 12 82 20 82 44 C82 67 50 85 50 85 C50 85 18 67 18 44 C18 20 30 12 50 12 Z' fill='none' stroke='%23F59E0B' stroke-width='2.5' opacity='0.8'/%3E%3Cpath d='M50 22 L74 31 L50 40 L26 31 Z' fill='%23F59E0B'/%3E%3Cpath d='M36 34.5 V42 C36 46 64 46 64 42 V34.5' fill='%23F59E0B'/%3E%3Cpath d='M50 31 L68 33.5 V43' fill='none' stroke='%23FFFFFF' stroke-width='1.5' stroke-linecap='round'/%3E%3Ccircle cx='68' cy='44.5' r='1.5' fill='%23FFFFFF'/%3E%3Cpath d='M32 54 C41 49.5 48 51.5 50 53.5 C52 51.5 59 49.5 68 54 L68 68 C59 63.5 52 65.5 50 67.5 C48 65.5 41 63.5 32 68 Z' fill='%23FFFFFF'/%3E%3Cline x1='50' y1='53.5' x2='50' y2='67.5' stroke='%23F59E0B' stroke-width='1.5'/%3E%3Cpath d='M42.5 59 L47.5 64 L57.5 53.5' fill='none' stroke='%23059669' stroke-width='4.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@0.460.0"></script>
  <!-- Supabase JS Library CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="login-wrapper">

    <div class="login-card card">
      <div class="login-header">
        <div class="login-logo" id="login-logo-container" style="width: 80px; height: 80px; background: transparent; box-shadow: none;">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" class="amana-logo" style="width: 100%; height: 100%;">
            <defs>
              <linearGradient id="amanaShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#059669" />
                <stop offset="100%" stop-color="#047857" />
              </linearGradient>
              <linearGradient id="amanaGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#F59E0B" />
                <stop offset="100%" stop-color="#D97706" />
              </linearGradient>
            </defs>
            <path d="M50 6 C75 6 88 16 88 44 C88 71 50 92 50 92 C50 92 12 71 12 44 C12 16 25 6 50 6 Z" fill="url(#amanaShieldGrad)" />
            <path d="M50 12 C70 12 82 20 82 44 C82 67 50 85 50 85 C50 85 18 67 18 44 C18 20 30 12 50 12 Z" fill="none" stroke="url(#amanaGoldGrad)" stroke-width="2.5" opacity="0.8" />
            <path d="M50 22 L74 31 L50 40 L26 31 Z" fill="url(#amanaGoldGrad)" />
            <path d="M36 34.5 V42 C36 46 64 46 64 42 V34.5" fill="url(#amanaGoldGrad)" />
            <path d="M50 31 L68 33.5 V43" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />
            <circle cx="68" cy="44.5" r="1.5" fill="#FFFFFF" />
            <path d="M32 54 C41 49.5 48 51.5 50 53.5 C52 51.5 59 49.5 68 54 L68 68 C59 63.5 52 65.5 50 67.5 C48 65.5 41 63.5 32 68 Z" fill="#FFFFFF" />
            <line x1="50" y1="53.5" x2="50" y2="67.5" stroke="url(#amanaGoldGrad)" stroke-width="1.5" />
            <path d="M42.5 59 L47.5 64 L57.5 53.5" fill="none" stroke="#059669" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </div>
        <h2>AmanaExam</h2>
        <p style="color: var(--text-muted); font-size: 0.875rem;">Platform Ujian Mandiri Siswa</p>
      </div>

      <!-- Live status of active session -->
      <div id="session-status-banner" style="margin-bottom: 1.5rem;"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="nisn" class="form-label">NISN (Nomor Induk Siswa Nasional)</label>
          <input type="text" id="nisn" class="form-control" placeholder="Contoh: 0012345678" required autocomplete="off" inputmode="numeric" pattern="[0-9]*">
          <small id="nisn-hint" style="color: var(--text-muted); font-size: 0.75rem; display: block; margin-top: 4px;">
            Masukkan 10 digit NISN Anda
          </small>
        </div>

        <div class="form-group" style="margin-bottom: 1.5rem;">
          <label for="nama" class="form-label">Nama Lengkap Siswa</label>
          <input type="text" id="nama" class="form-control" placeholder="Nama sesuai daftar hadir" required autocomplete="off">
        </div>

        <button type="submit" class="btn btn-primary" id="btn-submit" style="width: 100%;">
          <i data-lucide="log-in"></i> Masuk Ruang Ujian
        </button>
      </form>
    </div>

    <!-- Mini Footer -->
    <div style="margin-top: 2rem; text-align: center; font-size: 0.75rem; color: var(--text-muted);">
      <p>Koneksi: Cloud Database (Supabase Active)</p>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/logo-utils.js"></script>
  <script src="js/siswa-login.js"></script>
</body>
</html>
